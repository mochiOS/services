[package]
name = "service-manager"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
posix-native-probes = ["dep:libc"]
# Dedicated development VM: launch the authenticated Unix API fixture after
# native filesystem/POSIX startup, without starting the desktop or drivers.
native-unix-extension-probe = []
# Executable-reference tests also require the ordinary account authority before
# calling the application launch broker. Never substitute a synthetic session.
native-executable-reference-probe = ["native-unix-extension-probe"]

[dependencies]
libc = { git = "https://github.com/mochiOS/libc", rev = "a3c482e222b53700a09d21377633836e2fee07be", optional = true }
mochios-keychain-protocol = { git = "https://github.com/mochiOS/syscalls" }
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-driver-control-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-driver-control-protocol" }
mochios-filesystem-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-filesystem-protocol" }
mochios-linux-portal-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-linux-portal-protocol" }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false, features = ["syscall-endpoint", "launch-arguments"] }
mochios-package-protocol = { git = "https://github.com/mochiOS/syscalls" }
mochios-signature-protocol = { git = "https://github.com/mochiOS/syscalls" }
mochios-user-database = { git = "https://github.com/mochiOS/syscalls", package = "mochios-user-database", features = ["std"] }
mochios-permission-prompt-protocol = { path = "../permission-prompt-protocol" }

[[bin]]
name = "service-manager"
path = "src/main.rs"
test = false
bench = false
harness = false
