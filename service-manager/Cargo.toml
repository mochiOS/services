[package]
name = "service-manager"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-driver-control-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-driver-control-protocol" }
mochios-filesystem-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-filesystem-protocol" }
mochios-linux-portal-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-linux-portal-protocol" }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false, features = ["syscall-endpoint"] }
mochios-package-protocol = { path = "../../user/crates/package-protocol" }
mochios-signature-protocol = { path = "../../user/crates/signature-protocol" }
mochios-user-database = { git = "https://github.com/mochiOS/syscalls", package = "mochios-user-database", features = ["std"] }
mochios-permission-prompt-protocol = { path = "../permission-prompt-protocol" }

[[bin]]
name = "service-manager"
path = "src/main.rs"
test = false
bench = false
harness = false
