[package]
name = "logger"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client" }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }

[build-dependencies]

[features]
# Opt-in trusted debugging only: early boot logs can contain privileged data.
early-serial-diagnostics = []

[[bin]]
name = "logger"
path = "src/main.rs"
test = false
bench = false
harness = false
