[package]
name="native-executable-reference-fixture"
version="0.1.0"
edition="2024"
[workspace]
[dependencies]
libc = "0.2"
mochi-user-platform={git = "https://github.com/mochiOS/syscalls",default-features=false,features=["std"]}
mochios-posix-client={git = "https://github.com/mochiOS/syscalls",default-features=false,features=["syscall-endpoint"]}
mochios-posix-protocol={git = "https://github.com/mochiOS/syscalls"}
appcore={package="mochios-appcore",git = "https://github.com/mochiOS/devkit",default-features=false}

[[bin]]
name="executable-reference-probe"
path="probe.rs"
[[bin]]
name="executable-reference-launcher"
path="launcher.rs"

[profile.release]
panic="abort"
