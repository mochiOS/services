[package]
name = "posix-service"
version = "0.1.0"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[dependencies]
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochios-filesystem-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-filesystem-protocol" }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }

[target.'cfg(target_os = "mochios")'.dependencies]
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false }

[dev-dependencies]
mochios-capability-protocol = { path = "../../user/crates/capability-protocol" }
mochios-viewkit-gpu-protocol = { path = "../../user/crates/viewkit-gpu-protocol" }
mochios-net-device-protocol = { path = "../../user/crates/net-device-protocol" }
mochios-user-protocol = { path = "../../user/crates/user-protocol" }
mochios-workspace-protocol = { path = "../../user/crates/workspace-protocol" }
mboot-protocol = { path = "../mboot-protocol" }
sha2 = { version = "0.10", default-features = false }
mochios-signature-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-signature-protocol" }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false, features = ["fd-table", "endpoint", "launch-arguments"] }
mochios-certificate-database = { path = "../../user/crates/certificate-database", features = ["std"] }
filesystem-service = { path = "../filesystem" }
ext4plus = { git = "https://github.com/arihant2math/ext4plus", rev = "382b9e0a65a4b5155015992aee74ff2a798764f8", default-features = false, features = [
    "multi-threaded",
    "sync",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "posix-service"
path = "src/main.rs"
test = false
bench = false
harness = false

[[test]]
name = "native_file_mutation_rights"
path = "tests/native_file_mutation_rights.rs"
harness = false

[[test]]
name = "native_processor_configuration"
path = "tests/native_processor_configuration.rs"
harness = false

[[test]]
name = "rust_thread_lifecycle"
path = "tests/rust_thread_lifecycle.rs"
harness = false

[[test]]
name = "native_queued_file_admission"
path = "tests/native_queued_file_admission.rs"
harness = false
