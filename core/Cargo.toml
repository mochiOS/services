[package]
name = "core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-signature-protocol = { path = "../../user/crates/signature-protocol" }
sha2 = { version = "0.10", default-features = false }

[features]
performance-benchmark = []

[build-dependencies]

[[bin]]
name = "core"
path = "src/main.rs"
test = false
bench = false
harness = false
