[package]
provenance = "built-in"
id = "org.mochios.tty"
name = "TTY Service"
version = "1"
vendor = "mochiOS"

[[binary]]
path = "/system/services/tty.service"
kind = "service"
requires = [
    "fs.read.all",
    "process.spawn",
    "process.inspect",
    "ipc.client",
    "ipc.server",
    "input.keyboard.global",
    "net.connect",
    "net.tls.connect",
    "net.http.request",
]
