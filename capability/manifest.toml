[package]
provenance = "built-in"
id = "org.mochios.capability"
name = "Capability Service"
version = "1"
vendor = "mochiOS"

[[binary]]
path = "/system/services/capability.service"
kind = "service"
requires = [
    "fs.read.all",
    "fs.write.all",
    "process.spawn",
    "process.inspect",
    "system.random.read",
    "system.time.read",
    "service.register",
    "capabilities.manage",
    "account.authenticate",
    "account.other.modify",
    "io.port@0xcf8:8",
    "device.input",
    "display.read",
    "input.keyboard",
    "input.pointer",
    "ipc.client",
    "ipc.server",
]

[prompt]
interactive_capabilities = [
    "window.overlay",
    "input.pointer",
    "input.keyboard",
]
