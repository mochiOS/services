[package]
name = "display"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mochios-virtio-gpu-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-virtio-gpu-protocol" }
mochios-viewkit-gpu-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-viewkit-gpu-protocol" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
plugkit = { git = "https://github.com/mochiOS/mnu", package = "plugkit" }
bootui = { git = "https://github.com/mochiOS/BootUI", rev = "4b0fca76023d9484d33a179946dc0fc5b770dd29" }

[build-dependencies]
png = "0.17.16"

[[bin]]
name = "display"
path = "src/main.rs"
test = false
bench = false
harness = false

[[test]]
name = "display"
path = "src/main.rs"
