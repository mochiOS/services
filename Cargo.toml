[workspace]
resolver = "2"
members = [
    "capability",
    "compositor",
    "core",
    "display",
    "drivers",
    "filesystem",
    "input",
    "logger",
    "linux",
    "mboot-protocol",
    "mboot-agent",
    "network",
    "package",
    "permission-prompt-protocol",
    "service-manager",
    "secure-ui",
    "signature",
    "tty",
    "update",
    "user",
    "workspace",
]

[patch.crates-io]
mochios-mdriver-protocol = { path = "../boot/crates/mdriver-protocol" }
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }

[patch."https://github.com/mochiOS/mBoot"]
mboot-protocol = { path = "mboot-protocol" }

[patch."https://github.com/mochiOS/syscalls"]
mochios-filesystem-protocol = { path = "../user/crates/filesystem-protocol" }
mochios-workspace-protocol = { path = "../user/crates/workspace-protocol" }
