[workspace]
resolver = "2"
members = [
    "capability",
    "compositor",
    "core",
    "display",
    "drivers",
    "filesystem",
    "input",
    "keychain",
    "logger",
    "linux",
    "mboot-protocol",
    "mboot-agent",
    "network",
    "package",
    "permission-prompt-protocol",
    "posix",
    "service-manager",
    "secure-ui",
    "signature",
    "tty",
    "update",
    "user",
    "workspace",
]

[patch.crates-io]
mochios-mdriver-protocol = { git = "https://github.com/mochiOS/boot" }

[patch."https://github.com/mochiOS/mBoot"]
mboot-protocol = { path = "mboot-protocol" }

[patch."https://github.com/arihant2math/ext4plus"]
ext4plus = { path = "third_party/ext4plus" }
