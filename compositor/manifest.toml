[package]
provenance = "built-in"
id = "org.mochios.compositor"
name = "Compositor Service"
version = "1"
vendor = "mochiOS"

[[binary]]
path = "/system/services/compositor.service"
kind = "service"
requires = [
    "display.read",
    "fs.read.all",
    "input.keyboard",
    "input.keyboard.global",
    "input.pointer",
    "input.pointer.global",
    "ipc.client",
    "ipc.server",
    "process.inspect",
    "process.spawn",
    "system.random.read",
    "window.create",
    "window.overlay",
]
