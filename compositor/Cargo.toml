[package]
name = "compositor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-viewkit-gpu-protocol = { git = "https://github.com/mochiOS/syscalls", rev = "39cb6d1d159af4e9072b3c9e2e4c84ec91e3d0d6", package = "mochios-viewkit-gpu-protocol" }
bootui = { git = "https://github.com/mochiOS/BootUI", rev = "4b0fca76023d9484d33a179946dc0fc5b770dd29" }

[build-dependencies]
png = "0.17.16"

[[bin]]
name = "compositor"
path = "src/main.rs"
test = false
bench = false
harness = false

[[test]]
name = "compositor"
path = "src/main.rs"
