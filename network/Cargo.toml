[package]
name = "network"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
test-web-pki = ["mochios-tls-client/test-web-pki"]

[dependencies]
mochi-user-platform = { path = "../../user/crates/platform" }
mochi-user-runtime = { path = "../../user/crates/runtime" }
mochi-user-syscall = { path = "../../user/crates/syscall" }
mochios-net-device-protocol = { path = "../../user/crates/net-device-protocol" }
mochios-network-stack = { path = "../../user/crates/network-stack" }
mochios-tls-client = { path = "../../user/crates/tls-client" }
mochios-http-client = { path = "../../user/crates/http-client" }
getrandom = { version = "0.2.17", features = ["custom"] }

[[bin]]
name = "network"
path = "src/main.rs"
test = false
bench = false
harness = false
